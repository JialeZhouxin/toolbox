<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c27a3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="脑筋急转弯">
    <link rel="apple-touch-icon" href="../heart-talk/icons/icon-192.png">
    <title>脑筋急转弯</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/theme.css">
    <style>


        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at 12% 14%, rgba(255, 240, 220, 0.9) 0%, rgba(255, 240, 220, 0) 36%),
                radial-gradient(circle at 86% 18%, rgba(244, 216, 183, 0.75) 0%, rgba(244, 216, 183, 0) 34%),
                linear-gradient(160deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            /* 背景画在 body 上，内容比视口矮时下方会露白出现接缝，撑满视口 */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding: 28px 18px calc(40px + env(safe-area-inset-bottom));
            line-height: 1.55;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.26s ease, color 0.2s ease;
        }

        .container { width: 100%; max-width: 760px; position: relative; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            animation: rise-in 0.4s ease-out both;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 10px;
            border-radius: 999px;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--accent-strong); }
        .theme-toggle-btn {
            min-width: 104px;
            padding: 9px 14px;
        }

        header { text-align: center; margin-bottom: 26px; animation: rise-in 0.5s ease-out both; }

        header h1 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: clamp(2rem, 4.3vw, 2.8rem);
            letter-spacing: 0.04em;
            color: #5c3d24;
            margin-bottom: 8px;
        }

        header p { color: var(--text-secondary); font-size: 1.02rem; }

        .progress {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 14px;
            animation: rise-in 0.55s ease-out both;
        }

        .card-container {
            background: var(--paper);
            border: 1px solid rgba(228, 204, 176, 0.78);
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius-xl);
            padding: 34px 28px;
            min-height: 312px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: rise-in 0.6s ease-out both;
        }

        .card-container::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(130deg, rgba(255, 244, 228, 0.75) 0%, rgba(255, 244, 228, 0) 46%),
                repeating-linear-gradient(0deg, rgba(191, 147, 107, 0.035) 0, rgba(191, 147, 107, 0.035) 1px, transparent 1px, transparent 6px);
        }

        .question, .answer { position: relative; z-index: 1; }

        .question {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: clamp(1.28rem, 2.7vw, 1.68rem);
            line-height: 1.75;
            color: #422c1a;
            text-align: center;
        }

        .answer {
            margin-top: 24px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            background: var(--paper-strong);
            border: 1px dashed #d9b98f;
            color: #65472f;
            font-size: 1.05rem;
            text-align: center;
            line-height: 1.7;
            display: none;
        }
        .answer.show { display: block; animation: pop-in 0.24s ease-out; }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            animation: rise-in 0.65s ease-out both;
        }

        .btn {
            border: none;
            border-radius: 999px;
            min-height: 44px;
            padding: 12px 28px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn {
            background: linear-gradient(160deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #fff;
            box-shadow: 0 8px 18px rgba(166, 98, 38, 0.3);
        }
        .btn-secondary {
            background: #fff3e5;
            color: #875734;
            border: 1px solid #e0bf9b;
            box-shadow: 0 8px 16px rgba(113, 76, 40, 0.12);
        }
        .btn:focus-visible { outline: 2px solid #b96a2b; outline-offset: 2px; }

        .footer-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            animation: rise-in 0.7s ease-out both;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pop-in {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px calc(26px + env(safe-area-inset-bottom)); }
            header { margin-bottom: 18px; }
            header p { font-size: 0.95rem; }
            .card-container { padding: 26px 18px; min-height: 280px; }
            .question { font-size: clamp(1.12rem, 4.7vw, 1.35rem); line-height: 1.66; }
            .btn { width: 100%; min-height: 46px; padding-top: 11px; padding-bottom: 11px; }
            .controls { flex-direction: column; align-items: stretch; gap: 8px; }
        }

        @media (max-width: 360px) {
            body { padding: 14px 10px calc(20px + env(safe-area-inset-bottom)); }
            header h1 { font-size: 1.82rem; letter-spacing: 0.02em; }
            header p { font-size: 0.9rem; }
            .card-container { min-height: 248px; padding: 20px 14px; }
            .question { font-size: 1.05rem; line-height: 1.62; }
            .btn { min-height: 46px; font-size: 0.94rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        :root[data-theme='dark'] .question { color: #f7e7d2; }
        :root[data-theme='dark'] .answer {
            background: #32281f;
            border-color: #5b4835;
            color: #e8d4bd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a class="back-link" href="../">← 返回工具箱</a>
            <button class="btn-secondary btn theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="切换夜间护眼模式">夜间护眼</button>
        </div>
        <header>
            <h1>🧠 脑筋急转弯</h1>
            <p>考考你的脑洞</p>
        </header>
        <div class="progress" id="progress"></div>
        <div class="card-container">
            <div class="question" id="question"></div>
            <div class="answer" id="answer"></div>
        </div>
        <div class="controls">
            <button class="btn" id="revealBtn">揭晓答案</button>
            <button class="btn btn-secondary" id="nextBtn">下一题</button>
        </div>
        <div class="footer-note">答完所有题自动打乱再来一轮</div>
    </div>
    <script>
        const QUESTIONS = [
            { q: "什么东西越洗越脏？", a: "水" },
            { q: "天气越热，什么东西爬得越高？", a: "温度计" },
            { q: "什么东西倒立后会增加一半？", a: "数字 6（倒过来是 9）" },
            { q: "什么东西越晒越湿？", a: "冰" },
            { q: "什么路最窄？", a: "冤家路窄" },
            { q: "什么门永远关不上？", a: "球门" },
            { q: "什么书最贵？", a: "结婚证书" },
            { q: "什么书买不到？", a: "遗书" },
            { q: "什么车不能开？", a: "风车" },
            { q: "什么车最长？", a: "塞车（堵车）" },
            { q: "什么布剪不断？", a: "瀑布" },
            { q: "什么马不吃草？", a: "木马" },
            { q: "什么老鼠不怕猫？", a: "米老鼠" },
            { q: "什么猫不抓老鼠？", a: "熊猫" },
            { q: "什么狗不咬人？", a: "热狗" },
            { q: "什么牛不吃草？", a: "蜗牛" },
            { q: "什么鸡不下蛋？", a: "公鸡" },
            { q: "什么人一年只上一天班？", a: "圣诞老人" },
            { q: "什么花没有枝？", a: "雪花（烟花）" },
            { q: "什么蛋不能吃？", a: "笨蛋（脸蛋）" },
            { q: "什么鱼不能吃？", a: "木鱼" },
            { q: "什么瓜不能吃？", a: "傻瓜" },
            { q: "什么杯不能喝水？", a: "奖杯" },
            { q: "什么伞不能遮雨？", a: "降落伞" },
            { q: "什么表不能看时间？", a: "水表" },
            { q: "什么床不能睡？", a: "河床" },
            { q: "什么桥不能过人？", a: "彩虹桥" },
            { q: "什么网不能捕鱼？", a: "互联网" },
            { q: "什么帽不能戴？", a: "螺丝帽" },
            { q: "什么纸不能写字？", a: "砂纸" },
            { q: "什么竹子不长叶？", a: "爆竹" },
            { q: "什么门最受欢迎？", a: "热门" },
            { q: "什么头没有脸？", a: "馒头" },
            { q: "什么东西有头没脚？", a: "枕头" },
            { q: "什么东西有五个手指却不会干活？", a: "手套" },
            { q: "什么东西有牙却不能咬？", a: "齿轮" },
            { q: "什么东西有嘴不会说话？", a: "茶壶" },
            { q: "什么东西有脚却不会走路？", a: "桌子椅子" },
            { q: "什么东西越剪越大？", a: "洞" },
            { q: "什么东西打破才能用？", a: "鸡蛋" },
            { q: "什么东西越洗越小？", a: "肥皂" },
            { q: "什么东西你打死也不吃？", a: "亏（吃亏）" },
            { q: "什么灯最省电？", a: "关着的灯" },
            { q: "什么山没人敢爬？", a: "刀山" },
            { q: "什么海没有水？", a: "辞海" },
            { q: "什么河没有水？", a: "银河" },
            { q: "什么老虎不吃人？", a: "纸老虎" },
            { q: "什么动物的屁股最危险？", a: "老虎（老虎屁股摸不得）" },
            { q: "什么动物站着睡觉？", a: "马" },
            { q: "什么动物有九条命？", a: "猫" },
            { q: "什么动物最怕老鼠？", a: "大象" },
            { q: "什么植物最害羞？", a: "含羞草" },
            { q: "什么动物没有方向感？", a: "麋鹿（迷路）" },
            { q: "什么字人人都会写错？", a: "「错」字" },
            { q: "早晨四条腿、中午两条腿、晚上三条腿的是什么？", a: "人（婴儿爬、成人走、老人拄拐）" },
            { q: "什么数去掉头是十三，去掉尾是四十？", a: "四十三" },
            { q: "什么时候 1+1 不等于 2？", a: "算错的时候" },
            { q: "什么东西没有嘴却能说话？", a: "回声" },
            { q: "什么东西有尾巴却不会摇？", a: "彗星" },
        ];
        const $ = (id) => document.getElementById(id);
        let queue = [];

        // 夜间护眼模式（与心语卡牌一致）
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            $("themeToggleBtn").textContent = theme === 'dark' ? '暖色模式' : '夜间护眼';
            $("themeToggleBtn").setAttribute('aria-pressed', String(theme === 'dark'));
            try { localStorage.setItem('brain-teaser-theme', theme); localStorage.setItem('toolbox-theme', theme); } catch (e) {}
        }
        $("themeToggleBtn").addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });
        (function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('brain-teaser-theme'); } catch (e) {}
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(saved || (prefersDark ? 'dark' : 'light'));
        })();

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        function next() {
            if (!queue.length) queue = shuffle(QUESTIONS.slice());
            const item = queue.pop();
            $("answer").classList.remove("show");
            $("revealBtn").textContent = "揭晓答案";
            $("question").textContent = item.q;
            $("answer").textContent = "答案：" + item.a;
            const done = QUESTIONS.length - queue.length;
            $("progress").textContent = `第 ${done} / ${QUESTIONS.length} 题`;
        }
        $("revealBtn").addEventListener("click", () => {
            $("answer").classList.add("show");
            $("revealBtn").textContent = "已揭晓";
        });
        $("nextBtn").addEventListener("click", next);
        next();
    </script>
</body>
</html>
