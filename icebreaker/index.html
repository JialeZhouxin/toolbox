<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c27a3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="破冰游戏">
    <link rel="apple-touch-icon" href="../heart-talk/icons/icon-192.png">
    <title>破冰游戏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/theme.css">
    <style>


        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at 12% 14%, rgba(255, 240, 220, 0.9) 0%, rgba(255, 240, 220, 0) 36%),
                radial-gradient(circle at 86% 18%, rgba(244, 216, 183, 0.75) 0%, rgba(244, 216, 183, 0) 34%),
                linear-gradient(160deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            /* 背景画在 body 上，内容比视口矮时下方会露白出现接缝，撑满视口 */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding: 28px 18px calc(40px + env(safe-area-inset-bottom));
            line-height: 1.55;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.26s ease, color 0.2s ease;
        }

        .container { width: 100%; max-width: 760px; position: relative; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            animation: rise-in 0.4s ease-out both;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 10px;
            border-radius: 999px;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--accent-strong); }
        .theme-toggle-btn { min-width: 104px; padding: 9px 14px; }

        header { text-align: center; margin-bottom: 26px; animation: rise-in 0.5s ease-out both; }

        header h1 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: clamp(2rem, 4.3vw, 2.8rem);
            letter-spacing: 0.04em;
            color: #5c3d24;
            margin-bottom: 8px;
        }

        header p { color: var(--text-secondary); font-size: 1.02rem; }

        .mode-section {
            background: var(--paper);
            border: 1px solid rgba(228, 204, 176, 0.78);
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius-lg);
            padding: 14px 18px;
            margin-bottom: 18px;
            animation: rise-in 0.55s ease-out both;
        }
        .filter-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .filter-btn {
            border: 1px solid #d6b58f;
            background: #fff7ee;
            color: #80583a;
            border-radius: 999px;
            padding: 9px 15px;
            font-size: 0.9rem;
            min-height: 40px;
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.18s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(160deg, #d3955a 0%, #be7736 100%);
            color: #fff;
            border-color: #b46a2d;
            box-shadow: 0 7px 14px rgba(167, 101, 44, 0.24);
            transform: translateY(-1px);
        }
        .filter-btn:active { transform: scale(0.98); }

        .progress {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 14px;
            animation: rise-in 0.55s ease-out both;
        }

        .card-container {
            background: var(--paper);
            border: 1px solid rgba(228, 204, 176, 0.78);
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius-xl);
            padding: 34px 28px;
            min-height: 312px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: rise-in 0.6s ease-out both;
        }

        .card-container::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(130deg, rgba(255, 244, 228, 0.75) 0%, rgba(255, 244, 228, 0) 46%),
                repeating-linear-gradient(0deg, rgba(191, 147, 107, 0.035) 0, rgba(191, 147, 107, 0.035) 1px, transparent 1px, transparent 6px);
        }

        .card-category, .card-content, .card-hint { position: relative; z-index: 1; }

        .card-category {
            font-size: 0.9rem;
            color: #896a4d;
            margin-bottom: 12px;
            text-align: center;
        }

        .card-content {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: clamp(1.28rem, 2.7vw, 1.68rem);
            line-height: 1.75;
            color: #422c1a;
            text-align: center;
        }
        .card-content.word {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 700;
            letter-spacing: 0.06em;
        }
        .card-content.masked {
            color: #b49b7e;
            letter-spacing: 0.2em;
        }

        .card-hint {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.7;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            animation: rise-in 0.65s ease-out both;
        }

        .btn {
            border: none;
            border-radius: 999px;
            min-height: 44px;
            padding: 12px 28px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn {
            background: linear-gradient(160deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #fff;
            box-shadow: 0 8px 18px rgba(166, 98, 38, 0.3);
        }
        .btn-secondary {
            background: #fff3e5;
            color: #875734;
            border: 1px solid #e0bf9b;
            box-shadow: 0 8px 16px rgba(113, 76, 40, 0.12);
        }
        .btn:focus-visible { outline: 2px solid #b96a2b; outline-offset: 2px; }

        .footer-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            animation: rise-in 0.7s ease-out both;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px calc(26px + env(safe-area-inset-bottom)); }
            header { margin-bottom: 18px; }
            header p { font-size: 0.95rem; }
            .card-container { padding: 26px 18px; min-height: 280px; }
            .card-content { font-size: clamp(1.12rem, 4.7vw, 1.35rem); line-height: 1.66; }
            .card-content.word { font-size: clamp(1.4rem, 6vw, 1.9rem); }
            .btn { width: 100%; min-height: 46px; padding-top: 11px; padding-bottom: 11px; }
            .controls { flex-direction: column; align-items: stretch; gap: 8px; }
            .filter-btn { min-height: 44px; padding: 8px 14px; }
        }

        @media (max-width: 360px) {
            body { padding: 14px 10px calc(20px + env(safe-area-inset-bottom)); }
            header h1 { font-size: 1.82rem; letter-spacing: 0.02em; }
            header p { font-size: 0.9rem; }
            .card-container { min-height: 248px; padding: 20px 14px; }
            .card-content { font-size: 1.05rem; line-height: 1.62; }
            .card-content.word { font-size: 1.3rem; }
            .btn { min-height: 46px; font-size: 0.94rem; }
        }

        @media (max-width: 420px) {
            .filter-buttons .filter-btn { flex: 1 1 calc(50% - 8px); text-align: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        :root[data-theme='dark'] .card-content { color: #f7e7d2; }
        :root[data-theme='dark'] .card-content.masked { color: #7d6853; }
        :root[data-theme='dark'] .card-category { color: #d4b493; }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a class="back-link" href="../">← 返回工具箱</a>
            <button class="btn-secondary btn theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="切换夜间护眼模式">夜间护眼</button>
        </div>
        <header>
            <h1>🎉 破冰游戏</h1>
            <p>人还不熟？来一局就熟了</p>
        </header>
        <div class="mode-section">
            <div class="filter-buttons" id="modeFilters">
                <button class="filter-btn active" data-mode="card">话题卡</button>
                <button class="filter-btn" data-mode="team">默契测试</button>
                <button class="filter-btn" data-mode="liar">两真一假</button>
                <button class="filter-btn" data-mode="draw">你画我猜</button>
            </div>
            <div class="filter-buttons" id="categoryFilters" style="margin-top: 12px;"></div>
        </div>
        <div class="progress" id="progress"></div>
        <div class="card-container">
            <div class="card-category" id="cardCategory"></div>
            <div class="card-content" id="cardContent"></div>
            <div class="card-hint" id="cardHint"></div>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" id="revealBtn" style="display:none;">我是画手，查看词语</button>
            <button class="btn" id="nextBtn">换一个</button>
        </div>
        <div class="footer-note">轮流抽题回答，答完自动打乱再来一轮</div>
    </div>
    <script>
        const TOPICS = {
            light: [
                "如果明天放假一天，你最想做什么？",
                "你最近循环播放的一首歌是什么？",
                "旅行你更喜欢海边还是山里？",
                "你手机里最近一张照片拍的是什么？",
                "你吃过最奇怪的东西是什么？",
                "假如能瞬间学会一项技能，你选什么？",
                "你小时候的梦想职业是什么？",
                "你最喜欢的早餐是什么？",
                "你养过最难忘的宠物是什么？",
                "你最近一次熬夜是因为什么？",
                "如果只带三样东西去荒岛，你带什么？",
                "你觉得自己最像哪种动物？",
                "你最近在看什么剧、电影或书？",
                "你点奶茶必加的小料是什么？",
                "你做过最勇敢的事是什么？",
            ],
            deep: [
                "你最近一次真正开心是什么时候？因为什么？",
                "有没有一句话一直支撑着你？",
                "你最想感谢的人是谁？想对他或她说什么？",
                "如果可以回到过去，你想对几岁的自己说什么？",
                "你理想中的一天是怎么度过的？",
                "你觉得自己最大的优点是什么？",
                "你最近有什么小烦恼想说出来？",
                "什么样的人会让你觉得相处舒服？",
                "你人生中做过最正确的决定是什么？",
                "你最害怕失去什么？",
                "你希望十年后的自己过着怎样的生活？",
                "你最珍惜的一段关系是什么？为什么？",
            ],
            funny: [
                "如果变成动物一天，你想当什么？为什么？",
                "你微信里最久没联系的好友是谁？",
                "如果世界末日只剩一个群聊，你希望是哪群人？",
                "你最想删掉的「黑历史」是什么？",
                "如果必须和一种食物结婚，你选什么？",
                "你做过最社死的事是什么？",
                "你家里最奇怪的一样东西是什么？",
                "如果可以隐身一天，你会去干嘛？",
                "你手机里最离谱的表情包是什么？",
                "如果人生能存档读档，你最想重来哪一天？",
                "让你连续吃一个月，你选什么菜？",
                "如果给你的好朋友起个外号，你起什么？",
            ],
        };
        const TEAM = [
            "谁是第一个睡着的人？",
            "谁最会砍价？",
            "谁能吃最辣的辣？",
            "谁最可能忘记带钥匙？",
            "谁唱歌最好听？",
            "谁最像操心的老母亲？",
            "谁最可能裸辞去旅行？",
            "谁手机电量最危险？",
            "谁最会讲冷笑话？",
            "谁最像团队里的开心果？",
            "谁最可能迟到？",
            "谁最有「社交牛杂症」？",
            "谁最可能把天聊死？",
            "谁最会藏零食？",
        ];
        const LIAR = [
            "童年糗事",
            "旅行经历",
            "吃过的奇怪食物",
            "曾经的奇葩爱好",
            "上学时期的壮举",
            "和宠物有关的事",
            "隐藏才艺",
            "最离谱的一次意外",
            "家人不知道的秘密爱好",
            "网购踩过的坑",
        ];
        const WORDS = {
            easy: [
                "苹果", "牙刷", "眼镜", "自行车", "飞机", "猫", "狗", "鱼", "太阳", "月亮",
                "房子", "西瓜", "香蕉", "桌子", "椅子", "床", "闹钟", "书包", "蛋糕", "篮球",
                "电脑", "手机", "水杯", "雨伞", "汽车",
            ],
            mid: [
                "吃火锅", "打篮球", "刷牙", "打电话", "洗澡", "弹钢琴", "钓鱼", "开车", "睡懒觉", "大哭",
                "跑步", "游泳", "跳舞", "唱歌", "拍照", "做饭", "扫地", "化妆", "理发", "骑单车",
                "举重", "跳绳", "放风筝", "爬山", "潜水",
            ],
            hard: [
                "画蛇添足", "守株待兔", "掩耳盗铃", "亡羊补牢", "对牛弹琴", "狐假虎威", "刻舟求剑", "拔苗助长",
                "井底之蛙", "杯弓蛇影", "翻白眼", "打呼噜", "扎马步", "打太极", "跳广场舞",
                "点外卖", "堵车", "加班", "相亲", "秀恩爱",
            ],
        };
        const CATS = {
            card: [["all", "全部"], ["light", "轻松热场"], ["deep", "深入走心"], ["funny", "搞怪无厘头"]],
            draw: [["all", "全部"], ["easy", "简单 · 物品"], ["mid", "中等 · 动作"], ["hard", "困难 · 成语"]],
        };
        const CAT_LABEL = {
            card: { all: "随机话题", light: "轻松热场", deep: "深入走心", funny: "搞怪无厘头" },
            draw: { all: "随机词库", easy: "简单 · 物品", mid: "中等 · 动作", hard: "困难 · 成语" },
        };
        const $ = (id) => document.getElementById(id);
        let mode = "card";
        let cat = "all";
        let revealed = false;
        let currentWord = null;
        const queues = { card: {}, team: [], liar: [], draw: {} };

        // 夜间护眼模式（与各工具一致）
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            $("themeToggleBtn").textContent = theme === 'dark' ? '暖色模式' : '夜间护眼';
            $("themeToggleBtn").setAttribute('aria-pressed', String(theme === 'dark'));
            try { localStorage.setItem('icebreaker-theme', theme); localStorage.setItem('toolbox-theme', theme); } catch (e) {}
        }
        $("themeToggleBtn").addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });
        (function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('icebreaker-theme'); } catch (e) {}
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(saved || (prefersDark ? 'dark' : 'light'));
        })();

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildCategoryButtons() {
            const defs = CATS[mode];
            const wrap = $("categoryFilters");
            if (!defs) { wrap.style.display = "none"; return; }
            wrap.style.display = "";
            wrap.innerHTML = defs.map(([key, label]) =>
                `<button class="filter-btn${key === cat ? " active" : ""}" data-cat="${key}">${label}</button>`
            ).join("");
        }

        function drawPool() {
            return cat === "all" ? [...WORDS.easy, ...WORDS.mid, ...WORDS.hard] : WORDS[cat];
        }

        function maskWord(word) {
            return word.replace(/[^\s]/g, "？");
        }

        function next() {
            revealed = false;
            if (mode === "card") {
                const pool = cat === "all" ? [...TOPICS.light, ...TOPICS.deep, ...TOPICS.funny] : TOPICS[cat];
                if (!queues.card[cat] || !queues.card[cat].length) queues.card[cat] = shuffle(pool.slice());
                const item = queues.card[cat].pop();
                $("cardCategory").textContent = "「" + CAT_LABEL.card[cat] + "」";
                $("cardContent").textContent = item;
                $("cardContent").className = "card-content";
                $("cardHint").textContent = "轮到谁就谁来回答，其他人也可以补充";
                $("progress").textContent = `第 ${pool.length - queues.card[cat].length} / ${pool.length} 题`;
            } else if (mode === "team") {
                if (!queues.team.length) queues.team = shuffle(TEAM.slice());
                $("cardCategory").textContent = "全员投票";
                $("cardContent").textContent = "全组投票：" + queues.team.pop();
                $("cardContent").className = "card-content";
                $("cardHint").textContent = "每人轮流猜一个答案，得票最多的当选";
                $("progress").textContent = `共 ${TEAM.length} 题 · 答完自动打乱`;
            } else if (mode === "liar") {
                if (!queues.liar.length) queues.liar = shuffle(LIAR.slice());
                $("cardCategory").textContent = "本期主题";
                $("cardContent").textContent = queues.liar.pop();
                $("cardContent").className = "card-content";
                $("cardHint").innerHTML = '规则：每人说 3 句话，<b>2 句真 1 句假</b>，其他人猜哪句是假的。<br>围绕主题编你的三句话，一轮猜完换下一个人。';
                $("progress").textContent = `共 ${LIAR.length} 个主题 · 抽完自动打乱`;
            } else {
                const pool = drawPool();
                if (!queues.draw[cat] || !queues.draw[cat].length) queues.draw[cat] = shuffle(pool.slice());
                currentWord = queues.draw[cat].pop();
                renderDraw();
                $("progress").textContent = `第 ${pool.length - queues.draw[cat].length} / ${pool.length} 题`;
            }
        }

        function renderDraw() {
            $("cardCategory").textContent = "「" + CAT_LABEL.draw[cat] + "」";
            $("cardContent").className = "card-content word" + (revealed ? "" : " masked");
            if (revealed) {
                $("cardContent").textContent = currentWord;
                $("cardHint").textContent = "画出来，但不能写这个字本身哦";
                $("revealBtn").textContent = "遮住词语";
            } else {
                $("cardContent").textContent = maskWord(currentWord);
                $("cardHint").textContent = "词语已遮住 · 只有画手能查看，别偷看哦";
                $("revealBtn").textContent = "我是画手，查看词语";
            }
        }

        $("modeFilters").addEventListener("click", (e) => {
            const btn = e.target.closest(".filter-btn");
            if (!btn) return;
            mode = btn.dataset.mode;
            cat = "all";
            document.querySelectorAll("#modeFilters .filter-btn").forEach((b) => b.classList.toggle("active", b === btn));
            buildCategoryButtons();
            $("revealBtn").style.display = mode === "draw" ? "" : "none";
            next();
        });
        $("categoryFilters").addEventListener("click", (e) => {
            const btn = e.target.closest(".filter-btn");
            if (!btn) return;
            cat = btn.dataset.cat;
            document.querySelectorAll("#categoryFilters .filter-btn").forEach((b) => b.classList.toggle("active", b === btn));
            next();
        });
        $("revealBtn").addEventListener("click", () => {
            if (mode !== "draw" || !currentWord) return;
            revealed = !revealed;
            renderDraw();
        });
        $("nextBtn").addEventListener("click", next);
        buildCategoryButtons();
        next();
    </script>
</body>
</html>
