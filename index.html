<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c27a3a">
    <title>我的工具箱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./shared/theme.css">
    <style>

        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at 12% 14%, rgba(255, 240, 220, 0.9) 0%, rgba(255, 240, 220, 0) 36%),
                radial-gradient(circle at 86% 18%, rgba(244, 216, 183, 0.75) 0%, rgba(244, 216, 183, 0) 34%),
                linear-gradient(160deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            /* 背景画在 body 上，内容比视口矮时下方会露白出现接缝，
               撑满视口高度让渐变覆盖整屏 */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding: 28px 18px calc(40px + env(safe-area-inset-bottom));
            line-height: 1.55;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.26s ease, color 0.2s ease;
        }

        .container { width: 100%; max-width: 900px; }
        header { text-align: center; margin-bottom: 32px; animation: rise-in 0.5s ease-out both; }

        header h1 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: clamp(2rem, 4.3vw, 2.8rem);
            letter-spacing: 0.04em;
            color: #5c3d24;
            margin-bottom: 8px;
        }

        header p { color: var(--text-secondary); font-size: 1.02rem; }

        /* ---- 工具网格：6 个工具，桌面 2 列 × 3 行 ---- */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .tool-card {
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: var(--paper);
            border: 1px solid rgba(228, 204, 176, 0.78);
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius-xl);
            padding: 24px 22px;
            min-height: 168px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s ease;
            animation: rise-in 0.6s ease-out both;
        }

        .tool-card:nth-child(1) { animation-delay: 0s; }
        .tool-card:nth-child(2) { animation-delay: 0.08s; }
        .tool-card:nth-child(3) { animation-delay: 0.16s; }
        .tool-card:nth-child(4) { animation-delay: 0.24s; }
        .tool-card:nth-child(5) { animation-delay: 0.32s; }
        .tool-card:nth-child(6) { animation-delay: 0.4s; }

        .tool-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 34px rgba(95, 60, 25, 0.16);
            border-color: var(--accent-soft, #e7c6a2);
        }
        .tool-card:focus-visible { outline: 2px solid #b96a2b; outline-offset: 2px; }

        /* 图标放在小块彩色底板里，每个工具一个色相 */
        .tool-card .icon {
            flex: none;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            line-height: 1;
            border-radius: 16px;
            background: var(--tile-bg, rgba(194, 122, 58, 0.13));
            margin-bottom: 14px;
        }

        .tool-card h2 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            color: #69462c;
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .tool-card p { font-size: 0.92rem; color: var(--text-secondary); line-height: 1.6; }

        /* 主格底部的功能小标签 */
        .tool-card .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
            padding-top: 16px;
        }
        .tool-card .chips span {
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: rgba(194, 122, 58, 0.11);
            border: 1px solid rgba(194, 122, 58, 0.18);
            padding: 4px 10px;
            border-radius: 999px;
        }
        /* 主格的「点这里」提示，靠右下 */
        .tool-card .enter {
            position: absolute;
            right: 24px;
            bottom: 22px;
            font-size: 1.1rem;
            color: var(--accent);
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .tool-card:hover .enter,
        .tool-card:focus-visible .enter {
            opacity: 1;
            transform: translateX(0);
        }

        .footer-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 28px;
            animation: rise-in 0.7s ease-out both;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 平板：保持两列，格子更紧凑 */
        @media (max-width: 860px) {
            .tool-grid { gap: 14px; }
            .tool-card { padding: 22px 20px; }
        }

        /* 手机：单列，全部等宽 */
        @media (max-width: 600px) {
            body { padding: 16px 12px calc(26px + env(safe-area-inset-bottom)); }
            header { margin-bottom: 24px; }
            .tool-grid { grid-template-columns: 1fr; }
            .tool-card { padding: 22px 20px; min-height: 0; }
            .tool-card .enter { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        :root[data-theme='dark'] .tool-card h2 { color: #ecd2b5; }
        :root[data-theme='dark'] .tool-card .chips span {
            background: rgba(214, 154, 92, 0.14);
            border-color: rgba(214, 154, 92, 0.24);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛠️ 我的工具箱</h1>
            <p>想用哪个，点哪个</p>
        </header>
        <div class="tool-grid">
            <a class="tool-card" href="./premarital/" style="--tile-bg: rgba(168, 100, 40, 0.15)">
                <div class="icon">💍</div>
                <h2>婚前辅导</h2>
                <p>多表单填写、双方对照、JSON 导入导出，本地保存不外传。适合婚前陪谈、婚姻预备课程。</p>
                <div class="chips">
                    <span>7 张表单</span>
                    <span>双方对照</span>
                    <span>单人填写</span>
                    <span>离线可用</span>
                </div>
                <span class="enter" aria-hidden="true">→</span>
            </a>
            <a class="tool-card" href="./heart-talk/" style="--tile-bg: rgba(194, 85, 122, 0.14)">
                <div class="icon">💌</div>
                <h2>心语卡牌</h2>
                <p>情侣、朋友、家庭深度对话卡牌，抽一张，聊一聊</p>
            </a>
            <a class="tool-card" href="./brain-teaser/" style="--tile-bg: rgba(194, 122, 58, 0.14)">
                <div class="icon">🧠</div>
                <h2>脑筋急转弯</h2>
                <p>随机出题考脑洞，看看你的脑筋转不转得过来</p>
            </a>
            <a class="tool-card" href="./icebreaker/" style="--tile-bg: rgba(58, 143, 138, 0.14)">
                <div class="icon">🎉</div>
                <h2>破冰游戏</h2>
                <p>话题卡、默契测试、两真一假、你画我猜，人还不熟？来一局就熟了</p>
            </a>
            <a class="tool-card" href="./mental-models/" style="--tile-bg: rgba(122, 106, 194, 0.14)">
                <div class="icon">🧩</div>
                <h2>思维模型卡</h2>
                <p>抽一个思维模型，套到眼前的事上：用一下、讲一遍、猜模型</p>
            </a>
            <a class="tool-card" href="./bible/" style="--tile-bg: rgba(176, 132, 62, 0.15)">
                <div class="icon">📖</div>
                <h2>圣经金句</h2>
                <p>抽一节经文，写下触动你的话；也能按卷查找或搜索全本，记录每日灵修</p>
            </a>
        </div>
        <div class="footer-note">一个仓库 · 多个小工具</div>
    </div>
    <script>
        // 主题跟随上次用过的工具：优先共享键 toolbox-theme，
        // 再回退到历史遗留的 brain-teaser-theme / theme。
        (function () {
            var saved = null;
            try {
                saved =
                    localStorage.getItem('toolbox-theme') ||
                    localStorage.getItem('brain-teaser-theme') ||
                    localStorage.getItem('theme');
            } catch (e) {}
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
</body>
</html>
