<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c27a3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="心语卡牌">
    <title>心语卡牌（离线包）</title>
    <script>
        // 首屏防闪：主题必须在 CSS 生效前定好，否则深色用户会先看到一帧暖色。
        // 这里只设 data-theme，业务逻辑仍由 src/main.js 负责。
        (function () {
            var t = null;
            try {
                t = localStorage.getItem('heartTalkTheme') || localStorage.getItem('toolbox-theme');
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        })();
    </script>
</head>
<body>

    <div class="container" style="padding-bottom:0">
      <div style="background:#e8f0ff;border:1px solid #b7c9ef;color:#1e2f5c;padding:10px 12px;border-radius:12px;margin:12px 0 0;font-size:14px;">
        离线单文件包：可直接双击打开，无需联网。对话历史仍只保存在本机浏览器。
      </div>
    </div>
<div class="container">
        <header>
            <div class="theme-switch-wrap">
                <button class="filter-btn theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="切换夜间护眼模式" aria-pressed="false">夜间护眼</button>
            </div>
            <h1>心语卡牌</h1>
            <p>用问题打开话匣子，让彼此更靠近一点</p>
        </header>

        <div class="filter-section">
            <h3>选择卡牌类型</h3>
            <div class="filter-buttons" id="categoryFilters">
                <button class="filter-btn active" data-category="all" aria-pressed="true">全部</button>
                <button class="filter-btn" data-category="couple" aria-pressed="false">情侣</button>
                <button class="filter-btn" data-category="friend" aria-pressed="false">朋友</button>
                <button class="filter-btn" data-category="family" aria-pressed="false">家庭</button>
                <button class="filter-btn" data-category="self" aria-pressed="false">自我</button>
            </div>
            <div class="filter-buttons level-filters" id="levelFilters">
                <button class="filter-btn active" data-level="all" aria-pressed="true">全部难度</button>
                <button class="filter-btn" data-level="1" aria-pressed="false">一级</button>
                <button class="filter-btn" data-level="2" aria-pressed="false">二级</button>
                <button class="filter-btn" data-level="3" aria-pressed="false">三级</button>
            </div>
        </div>

        <div class="card-container" id="cardContainer">
            <div class="empty-state" id="emptyState">
                <p>点击“抽取卡牌”开始对话</p>
                <p>适合情侣、朋友、家庭与自我探索场景</p>
            </div>
            <div id="cardContent" class="card-content" hidden>
                <div class="card-category" id="cardCategory"></div>
                <div class="card-level" id="cardLevel"></div>
                <div class="card-question" id="cardQuestion"></div>
                <div class="card-progress" id="cardProgress"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="drawBtn">抽取卡牌</button>
            <button class="btn btn-secondary" id="saveBtn" hidden>保存回答</button>
            <button class="btn btn-secondary" id="shareBtn" hidden>分享</button>
        </div>

        <div class="history-section">
            <h3>
                对话历史
                <button class="filter-btn clear-history-btn" id="clearHistoryBtn" type="button">清空</button>
            </h3>
            <div class="history-list" id="historyList" aria-live="polite">
                <div class="empty-state">
                    <p>暂无对话记录</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="saveModal" role="dialog" aria-modal="true" aria-labelledby="saveModalTitle">
        <div class="modal-content">
            <h3 id="saveModalTitle">你的回答</h3>
            <p class="modal-subtitle" id="saveModalQuestion"></p>
            <textarea id="answerInput" placeholder="写下你的思考和感受..." aria-label="你的回答"></textarea>
            <button class="btn" id="confirmSaveBtn">保存</button>
            <button class="btn btn-secondary" id="cancelSaveBtn">取消</button>
        </div>
    </div>

    <div class="modal" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
        <div class="modal-content">
            <h3 id="shareModalTitle">分享这张卡牌</h3>
            <div class="share-preview" id="sharePreview">
                <div class="question" id="shareQuestion"></div>
                <div class="answer" id="shareAnswer"></div>
            </div>
            <button class="btn" id="copyShareBtn">复制内容</button>
            <button class="btn btn-secondary" id="closeShareBtn">关闭</button>
        </div>
    </div>

    <div class="modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <div class="modal-content">
            <h3 id="confirmModalTitle">请确认操作</h3>
            <p class="modal-subtitle" id="confirmMessage"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="confirmCancelBtn">取消</button>
                <button class="btn" id="confirmOkBtn">确认</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    
<style>
/* ============================================================
   共享主题：暖色调 + 夜间模式
   所有工具页面统一引用：<link rel="stylesheet" href="../shared/theme.css">
   （根聚合首页用 href="./shared/theme.css"）
   ============================================================ */

/* ---- 基础变量（全工具共用调色板） ---- */
:root {
    --bg-main: #f6ecdf;
    --bg-secondary: #efe1cd;
    --paper: #fff9f1;
    --paper-strong: #fff5e8;
    --text-primary: #3d2c1f;
    --text-secondary: #715740;
    --text-muted: #9a7f67;
    --accent: #c27a3a;
    --accent-strong: #a86428;
    --accent-soft: #e7c6a2;
    --line: #e4ccb0;
    --success: #357a4c;
    --danger: #a54a2a;
    --shadow-soft: 0 10px 30px rgba(95, 60, 25, 0.12);
    --shadow-card: 0 16px 34px rgba(95, 60, 25, 0.16);
    --radius-xl: 26px;
    --radius-lg: 18px;
    --radius-md: 12px;
}

/* ---- 夜间模式变量 ---- */
:root[data-theme='dark'] {
    --bg-main: #1f1b17;
    --bg-secondary: #2b241e;
    --paper: #2f2821;
    --paper-strong: #3a3027;
    --text-primary: #f5e9d9;
    --text-secondary: #e3ccb2;
    --text-muted: #c1a88d;
    --accent: #d69a5c;
    --accent-strong: #ba7e40;
    --accent-soft: #8a6a45;
    --line: #5a4a3a;
    --success: #79b489;
    --danger: #d37f63;
    --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.3);
}

/* ---- 别名（premarital 短变量名 → 共享名） ---- */
:root {
    --bg: var(--bg-main);
    --bg2: var(--bg-secondary);
    --card: var(--paper);
    --card2: var(--paper-strong);
    --text: var(--text-primary);
    --muted: var(--text-secondary);
}

/* ---- 全局 reset ---- */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ---- 基础排版 ---- */
body {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    color: var(--text-primary);
    line-height: 1.55;
    transition: background 0.26s ease, color 0.2s ease;
}

/* ---- 共享组件：夜间模式适配 ---- */
:root[data-theme='dark'] header h1 { color: #f7e8d5; }
:root[data-theme='dark'] .btn-secondary {
    background: var(--paper-strong);
    color: #ecd2b5;
    border-color: #6a523b;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
}


body {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    color: var(--text-primary);
    background:
        radial-gradient(circle at 12% 14%, rgba(255, 240, 220, 0.9) 0%, rgba(255, 240, 220, 0) 36%),
        radial-gradient(circle at 86% 18%, rgba(244, 216, 183, 0.75) 0%, rgba(244, 216, 183, 0) 34%),
        linear-gradient(160deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
    /* 背景画在 body 上，min-height:100% 在 html 高度为 auto 时解析成 auto，
       内容比视口矮时下方会露白出现横向接缝，改用视口单位撑满 */
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 28px 18px calc(40px + env(safe-area-inset-bottom));
    line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.26s ease, color 0.2s ease;
}

.container {
    width: 100%;
    max-width: 760px;
    position: relative;
}

header {
    text-align: center;
    margin-bottom: 26px;
    animation: rise-in 0.5s ease-out both;
}

/* 返回工具箱：与其它工具页保持一致，触控目标不小于 44px */
.back-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 6px 10px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    border-radius: 999px;
    transition: color 0.2s ease;
}
.back-link:hover { color: var(--accent-strong); }

.theme-switch-wrap {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
}
.theme-toggle-btn {
    min-width: 104px;
    padding-inline: 14px;
}
/* 「下载离线包」是个 <a>，共用 .filter-btn 外观 */
.download-offline {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
}

/* 难度筛选与类型筛选之间的间距（原先是行内 style） */
.level-filters {
    margin-top: 15px;
}

/* 历史区的「清空」比普通筛选按钮小一号 */
.clear-history-btn {
    font-size: 0.8rem;
    padding: 5px 12px;
    min-height: 32px;
}

.modal-subtitle {
    margin-bottom: 15px;
    color: var(--text-muted);
}

header h1 {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    font-size: clamp(2rem, 4.3vw, 2.8rem);
    letter-spacing: 0.04em;
    color: #5c3d24;
    margin-bottom: 8px;
}

header p {
    color: var(--text-secondary);
    font-size: 1.02rem;
}

.filter-section,
.history-section,
.card-container,
.modal-content {
    background: var(--paper);
    border: 1px solid rgba(228, 204, 176, 0.78);
    box-shadow: var(--shadow-soft);
}

.filter-section,
.history-section {
    border-radius: var(--radius-lg);
    padding: 18px 18px 16px;
}

.filter-section {
    margin-bottom: 18px;
    animation: rise-in 0.55s ease-out both;
}

.filter-section h3,
.history-section h3 {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    color: #69462c;
    margin-bottom: 14px;
    font-size: 1.06rem;
}

.filter-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.filter-btn {
    border: 1px solid #d6b58f;
    background: #fff7ee;
    color: #80583a;
    border-radius: 999px;
    padding: 9px 15px;
    font-size: 0.9rem;
    min-height: 40px;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.18s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

/* JS 按「该类别下有没有三级卡」隐藏按钮，需要能盖过 flex 布局 */
.filter-btn[hidden] {
    display: none;
}

.filter-btn:hover,
.filter-btn.active {
    background: linear-gradient(160deg, #d3955a 0%, #be7736 100%);
    color: #fff;
    border-color: #b46a2d;
    box-shadow: 0 7px 14px rgba(167, 101, 44, 0.24);
    transform: translateY(-1px);
}

.filter-btn:active {
    transform: scale(0.98);
}

.card-container {
    border-radius: var(--radius-xl);
    padding: 34px 28px;
    min-height: 312px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    animation: rise-in 0.6s ease-out both;
}

.card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(130deg, rgba(255, 244, 228, 0.75) 0%, rgba(255, 244, 228, 0) 46%),
        repeating-linear-gradient(0deg, rgba(191, 147, 107, 0.035) 0, rgba(191, 147, 107, 0.035) 1px, transparent 1px, transparent 6px);
}

#cardContent,
#emptyState {
    position: relative;
    z-index: 1;
}

.empty-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 24px 12px;
}

.empty-state p + p {
    margin-top: 10px;
}

.card-category {
    font-size: 0.9rem;
    color: #896a4d;
    margin-bottom: 12px;
    text-transform: none;
}

.card-level,
.history-item .level-badge {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 0.8rem;
    font-weight: 700;
    border: 1px solid transparent;
    margin-bottom: 16px;
}

.level-1 {
    background: #f7ecdc;
    color: #8f5d2f;
    border-color: #e6c9a7;
}

.level-2 {
    background: #f4e2cf;
    color: #7b4625;
    border-color: #dfbb93;
}

.level-3 {
    background: #f0d9c7;
    color: #6e2f1e;
    border-color: #d8ab8d;
}

.card-question {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    font-size: clamp(1.28rem, 2.7vw, 1.68rem);
    line-height: 1.75;
    color: #422c1a;
}

/* 本轮进度：让「不重复抽完一轮」这件事可见 */
.card-progress {
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--text-muted);
}

.controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    animation: rise-in 0.65s ease-out both;
}

.btn {
    border: none;
    border-radius: 999px;
    min-height: 44px;
    padding: 12px 28px;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
    background: linear-gradient(160deg, var(--accent) 0%, var(--accent-strong) 100%);
    color: #fff;
    box-shadow: 0 8px 18px rgba(166, 98, 38, 0.3);
    transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, filter 0.2s ease;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn:active {
    transform: translateY(0) scale(0.98);
}

.btn-secondary {
    background: #fff3e5;
    color: #875734;
    border: 1px solid #e0bf9b;
    box-shadow: 0 8px 16px rgba(113, 76, 40, 0.12);
}

.history-section {
    margin-top: 4px;
    animation: rise-in 0.7s ease-out both;
}

.history-section h3 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.history-list {
    max-height: 420px;
    overflow-y: auto;
    padding-right: 4px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
}

.history-item {
    background: var(--paper-strong);
    border: 1px solid #ecd4b8;
    border-left: 4px solid #c68449;
    border-radius: var(--radius-md);
    padding: 13px;
    margin-bottom: 10px;
}

.history-item .timestamp {
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-bottom: 6px;
}

.history-item .question {
    color: #4d331f;
    font-weight: 600;
    margin-bottom: 8px;
}

.history-item .answer {
    background: #fffcf7;
    border: 1px solid #edd9c3;
    border-radius: 10px;
    color: #65472f;
    padding: 11px;
    white-space: pre-wrap;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(74, 51, 33, 0.42);
    backdrop-filter: blur(2px);
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
}

.modal.active {
    display: flex;
}

.modal-content {
    border-radius: 20px;
    width: min(540px, 100%);
    padding: 24px 20px;
    animation: pop-in 0.24s ease-out;
}

.modal-content h3 {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    color: #664327;
    margin-bottom: 16px;
}

.modal-content textarea {
    width: 100%;
    min-height: 140px;
    border: 1px solid #d7ba97;
    border-radius: 10px;
    background: #fffbf6;
    color: #4c3422;
    padding: 11px 12px;
    resize: vertical;
    margin-bottom: 14px;
    font: inherit;
}

.modal-content textarea:focus-visible,
.btn:focus-visible,
.filter-btn:focus-visible {
    outline: 2px solid #b96a2b;
    outline-offset: 2px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

.modal-actions .btn {
    min-width: 92px;
}

.share-preview {
    border: 1px solid #e4c9a9;
    border-radius: 14px;
    background: linear-gradient(150deg, #fff5e7 0%, #f8e7d2 100%);
    padding: 16px;
    text-align: left;
    margin-bottom: 16px;
}

.share-preview .question {
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    color: #50341f;
    font-size: 1.05rem;
    margin-bottom: 9px;
}

.share-preview .answer {
    color: #6a4a2f;
    background: rgba(255, 255, 255, 0.65);
    border-radius: 10px;
    padding: 10px;
    border: 1px solid #ead2b6;
}

#toastContainer {
    position: fixed;
    right: 18px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1200;
}

.toast {
    min-width: 220px;
    max-width: min(88vw, 320px);
    background: #fff8ee;
    border: 1px solid #e7c8a4;
    color: #6b4a2d;
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 8px 22px rgba(95, 60, 25, 0.18);
    opacity: 0;
    transform: translateY(6px);
    animation: toast-in 0.18s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

.toast.toast-error {
    border-left-color: var(--danger);
}

.toast.toast-success {
    border-left-color: var(--success);
}

.toast.toast-hide {
    animation: toast-out 0.18s ease forwards;
}

@keyframes rise-in {
    from {
        opacity: 0;
        transform: translateY(14px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pop-in {
    from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes toast-in {
    from {
        opacity: 0;
        transform: translateY(6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes toast-out {
    from {
        opacity: 1;
        transform: translateY(0);
    }
    to {
        opacity: 0;
        transform: translateY(4px);
    }
}

@media (max-width: 600px) {
    body {
        padding: 16px 12px calc(26px + env(safe-area-inset-bottom));
    }

    header {
        margin-bottom: 18px;
    }

    header p {
        font-size: 0.95rem;
    }

    .card-container {
        padding: 26px 18px;
        min-height: 280px;
    }

    .card-question {
        font-size: clamp(1.12rem, 4.7vw, 1.35rem);
        line-height: 1.66;
    }

    .btn {
        width: 100%;
        min-height: 46px;
        padding-top: 11px;
        padding-bottom: 11px;
    }

    .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
    }

    .filter-btn {
        min-height: 44px;
        padding: 8px 14px;
    }

    .filter-buttons {
        gap: 8px;
    }

    .history-list {
        max-height: 300px;
    }

    .modal-content {
        padding: 20px 16px;
    }

    .modal-content textarea {
        min-height: 120px;
    }

    #toastContainer {
        left: 12px;
        right: 12px;
        bottom: 14px;
    }

    .modal-actions {
        flex-direction: column-reverse;
    }
}

@media (max-width: 360px) {
    body {
        padding: 14px 10px calc(20px + env(safe-area-inset-bottom));
    }

    header h1 {
        font-size: 1.82rem;
        letter-spacing: 0.02em;
    }

    header p {
        font-size: 0.9rem;
    }

    .filter-section,
    .history-section {
        padding: 14px 12px;
    }

    .card-container {
        min-height: 248px;
        padding: 20px 14px;
    }

    .card-question {
        font-size: 1.05rem;
        line-height: 1.62;
    }

    .history-list {
        max-height: 240px;
    }

    .btn {
        min-height: 46px;
        font-size: 0.94rem;
    }
}

@media (min-width: 361px) and (max-width: 390px) {
    body {

// ---- src/core/card-service.js ----
function filterCards(cards, category, level) {
    return cards.filter((card) => {
        const categoryMatched = category === 'all' || card.category === category;
        const levelMatched = level === 'all' || String(card.level) === String(level);
        return categoryMatched && levelMatched;
    });
}

/** Fisher-Yates。random 可注入，便于自检。 */
function shuffle(items, random = Math.random) {
    const arr = items.slice();
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

/**
 * 同一轮内不重复出同文本。
 *
 * 卡库里 7 组题干逐字相同（同一句话在情侣/朋友/家庭/自我场景都成立），
 * 抽卡时若不去重，一场对话里可能连抽两条一样的题。先洗牌再去重，
 * 这样每组重复题每轮由哪一张代表是随机的。
 */
function dedupeByQuestion(cards) {
    const seen = new Set();
    return cards.filter((card) => {
        if (seen.has(card.question)) return false;
        seen.add(card.question);
        return true;
    });
}

/**
 * 抽卡队列：一轮内不出重复题，抽空后自动重洗。
 * 每个筛选组合（category|level）各有一条队列，切筛选不丢进度。
 */
function createDeck(random = Math.random) {
    const queues = new Map();

    return {
        draw(cards, key) {
            if (!cards.length) return null;

            const prev = queues.get(key);
            // 上一轮存在且已抽空 → 本次是重开一轮
            const restarted = Boolean(prev && !prev.queue.length);
            // 卡池变了（数据改动）就重洗，避免队列与筛选错位
            let entry = prev && prev.poolSize === cards.length ? prev : null;

            if (!entry || !entry.queue.length) {
                const queue = dedupeByQuestion(shuffle(cards, random));
                entry = { queue, poolSize: cards.length, total: queue.length };
            }

            const card = entry.queue.pop();
            queues.set(key, entry);

            return {
                card,
                restarted,
                drawn: entry.total - entry.queue.length,
                total: entry.total
            };
        }
    };
}

// ---- src/core/history-store.js ----
const HISTORY_KEY = 'heartTalkHistory';

function loadHistory() {
    try {
        const raw = localStorage.getItem(HISTORY_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
    } catch {
        return [];
    }
}

function saveHistory(history) {
    try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return true;
    } catch {
        return false;
    }
}

function clearHistoryStore() {
    try {
        localStorage.removeItem(HISTORY_KEY);
        return true;
    } catch {
        return false;
    }
}

// ---- src/ui/render.js ----
function createElement(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function renderCard({ currentCard, categoryNames, levelNames, progress, elements }) {
    const {
        emptyState,
        cardContent,
        cardCategory,
        cardLevel,
        cardQuestion,
        saveBtn,
        shareBtn
    } = elements;

    if (!currentCard) {
        emptyState.hidden = false;
        cardContent.hidden = true;
        saveBtn.hidden = true;
        shareBtn.hidden = true;
        return;
    }

    emptyState.hidden = true;
    cardContent.hidden = false;
    cardCategory.textContent = categoryNames[currentCard.category] || currentCard.category;
    cardLevel.textContent = levelNames[String(currentCard.level)] || `第${currentCard.level}级`;
    cardLevel.className = `card-level level-${currentCard.level}`;
    cardQuestion.textContent = currentCard.question;
    saveBtn.hidden = false;
    shareBtn.hidden = false;

    renderProgress(progress, elements);
}

function renderProgress(progress, elements) {
    const node = elements.cardProgress;
    if (!node) return;

    if (!progress) {
        node.textContent = '';
        return;
    }

    node.textContent = `本轮第 ${progress.drawn} / ${progress.total} 张`;
}

function renderHistory({ history, levelNames, historyList }) {
    historyList.replaceChildren();

    if (!history.length) {
        const empty = createElement('div', 'empty-state');
        empty.appendChild(createElement('p', '', '暂无对话记录'));
        historyList.appendChild(empty);
        return;
    }

    const fragment = document.createDocumentFragment();
    history.forEach((item) => {
        const wrapper = createElement('div', 'history-item');
        wrapper.appendChild(createElement('div', 'timestamp', item.timestamp));

        const badge = createElement('span', `level-badge level-${item.card.level}`);
        badge.textContent = levelNames[String(item.card.level)] || `第${item.card.level}级`;
        wrapper.appendChild(badge);

        wrapper.appendChild(createElement('div', 'question', item.card.question));
        wrapper.appendChild(createElement('div', 'answer', item.answer));
        fragment.appendChild(wrapper);
    });

    historyList.appendChild(fragment);
}

function buildNamesMap(selector, dataKey) {
    const map = {};
    document.querySelectorAll(selector).forEach((btn) => {
        const key = btn.dataset[dataKey];
        if (key && key !== 'all') {
            map[key] = btn.textContent.trim();
        }
    });
    return map;
}

function persistTheme(theme) {
    // 隐私模式下 setItem 会抛异常；主题本身仍然生效，只是不记住。
    try {
        localStorage.setItem(THEME_KEY, theme);
        localStorage.setItem(SHARED_THEME_KEY, theme);
    } catch {
        /* 存不下就算了，不影响本次切换 */
    }
}

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const isDark = theme === 'dark';
    elements.themeToggleBtn.textContent = isDark ? '暖色模式' : '夜间护眼';
    elements.themeToggleBtn.setAttribute('aria-pressed', String(isDark));
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    persistTheme(next);
    applyTheme(next);
    showToast(next === 'dark' ? '已切换到夜间护眼模式。' : '已切换到暖色模式。', 'success');
}

function showToast(message, type = 'info') {
    const oldToasts = elements.toastContainer.querySelectorAll('.toast');
    if (oldToasts.length >= 2) {
        oldToasts[0].remove();
    }

    const toast = document.createElement('div');
    toast.className = `toast ${type === 'error' ? 'toast-error' : type === 'success' ? 'toast-success' : ''}`.trim();
    toast.textContent = message;
    elements.toastContainer.appendChild(toast);

    setTimeout(() => {
        toast.classList.add('toast-hide');
        setTimeout(() => {
            toast.remove();
        }, UI_TIMING.toastExitMs);
    }, UI_TIMING.toastVisibleMs);
}

/* ---- 弹窗：焦点陷阱 + Escape + 滚动锁 ---- */

/** 打开的弹窗栈，栈顶是最后打开的那个。 */
const modalStack = [];
let lastFocused = null;

function focusableIn(modal) {
    return Array.from(
        modal.querySelectorAll('button, a[href], textarea, input, select, [tabindex]:not([tabindex="-1"])')
    ).filter((el) => !el.disabled && el.offsetParent !== null);
}

function topModal() {
    return modalStack.length ? modalStack[modalStack.length - 1] : null;
}

function onModalKeyDown(event) {
    const top = topModal();
    if (!top) return;

    if (event.key === 'Escape') {
        top.onClose();
        return;
    }
    if (event.key !== 'Tab') return;

    const items = focusableIn(top.modal);
    if (!items.length) return;

    const first = items[0];
    const last = items[items.length - 1];
    if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
    }
}

/** 打开弹窗；onClose 决定 Escape 与遮罩点击时做什么。 */
function openModal(modal, onClose) {
    if (modalStack.some((entry) => entry.modal === modal)) return;

    if (!modalStack.length) {
        lastFocused = document.activeElement;
        document.body.style.overflow = 'hidden';
        document.addEventListener('keydown', onModalKeyDown);
    }
    modalStack.push({ modal, onClose });
    modal.classList.add('active');
}

function closeModal(modal) {
    const index = modalStack.findIndex((entry) => entry.modal === modal);
    if (index === -1) return;

    modalStack.splice(index, 1);
    modal.classList.remove('active');

    if (!modalStack.length) {
        document.removeEventListener('keydown', onModalKeyDown);
        document.body.style.overflow = '';
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
        lastFocused = null;
    }
}

function showConfirm(message) {
    return new Promise((resolve) => {
        elements.confirmMessage.textContent = message;

        const settle = (value) => {
            elements.confirmOkBtn.removeEventListener('click', onConfirm);
            elements.confirmCancelBtn.removeEventListener('click', onCancel);
            elements.confirmModal.removeEventListener('click', onOverlayClick);
            closeModal(elements.confirmModal);
            resolve(value);
        };

        const onConfirm = () => settle(true);
        const onCancel = () => settle(false);
        const onOverlayClick = (event) => {
            if (event.target === elements.confirmModal) settle(false);
        };

        elements.confirmOkBtn.addEventListener('click', onConfirm);
        elements.confirmCancelBtn.addEventListener('click', onCancel);
        elements.confirmModal.addEventListener('click', onOverlayClick);
        openModal(elements.confirmModal, onCancel);
        elements.confirmOkBtn.focus();
    });
}

/* ---- 抽卡 ---- */

function drawCard() {
    const filtered = filterCards(cards, state.currentCategory, state.currentLevel);
    if (!filtered.length) {
        showToast('当前筛选条件下没有可用卡牌，请调整筛选后重试。', 'error');
        return;
    }

    const result = deck.draw(filtered, currentCardKey());
    state.currentCard = result.card;
    state.progress = { drawn: result.drawn, total: result.total };

    refreshCardView();
    if (result.restarted) {
        showToast('本轮已抽完，重新开始一轮。', 'info');
    }
    // CSS 的 prefers-reduced-motion 管不到 JS 指定的 behavior，这里自己判断
    const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    elements.cardContainer.scrollIntoView({
        behavior: reduceMotion ? 'auto' : 'smooth',
        block: 'center'
    });
}

/* ---- 保存 ---- */

function openSaveModal() {
    if (!state.currentCard) return;
    elements.saveModalQuestion.textContent = state.currentCard.question;

    const saved = getSavedItemForCurrentCard();
    elements.answerInput.value = saved ? saved.answer : '';

    openModal(elements.saveModal, closeSaveModal);
    elements.answerInput.focus();
}

function closeSaveModal() {
    closeModal(elements.saveModal);
}

function saveAnswer() {
    if (!state.currentCard) return;

    const answer = elements.answerInput.value.trim();
    if (!answer) {
        showToast('请先输入你的回答。', 'error');
        return;
    }

    const existing = getSavedItemForCurrentCard();
    const nextHistory = existing
        ? state.history.map((entry) =>
              entry === existing ? { ...entry, answer, timestamp: new Date().toLocaleString('zh-CN') } : entry
          )
        : [
              {
                  id: Date.now(),
                  timestamp: new Date().toLocaleString('zh-CN'),
                  card: state.currentCard,
                  answer
              },
              ...state.history
          ];

    // 先落盘再改内存：写失败时 state 不被污染，
    // 否则 UI 会假装没保存，下次渲染又冒出来、刷新后又消失。
    if (!saveHistory(nextHistory)) {
        showToast('保存失败，请检查浏览器存储权限。', 'error');
        return;
    }

    state.history = nextHistory;
    refreshHistoryView();
    closeSaveModal();
    showToast(existing ? '回答已更新。' : '回答已保存。', 'success');
}

/* ---- 分享 ---- */

function openShareModal() {
    if (!state.currentCard) return;

    elements.shareQuestion.textContent = state.currentCard.question;
    const saved = getSavedItemForCurrentCard();
    elements.shareAnswer.textContent = saved ? saved.answer : '（点击“保存回答”后可展示你的回答）';

    openModal(elements.shareModal, closeShareModal);
    elements.copyShareBtn.focus();
}

function closeShareModal() {
    closeModal(elements.shareModal);
}

function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    let ok = false;
    try {
        ok = document.execCommand('copy');
    } catch {
        ok = false;
    }

    document.body.removeChild(textarea);
    return ok;
}

async function copyShareLink() {
    if (!state.currentCard) return;

    const saved = getSavedItemForCurrentCard();
    const text = [
        '心语卡牌',
        '',
        state.currentCard.question,
        saved ? `\n${saved.answer}` : '',
        '',
        '来自心语卡牌'
    ].join('\n');

    try {
        if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            showToast('已复制到剪贴板。', 'success');
            return;
        }

        if (fallbackCopy(text)) {
            showToast('已复制到剪贴板。', 'success');
            return;
        }

        showToast('复制失败，请手动复制。', 'error');
    } catch {
        if (fallbackCopy(text)) {
            showToast('已复制到剪贴板。', 'success');
            return;
        }
        showToast('复制失败，请手动复制。', 'error');
    }
}

/* ---- 历史 ---- */

async function clearHistory() {
    const confirmed = await showConfirm('确定要清空所有历史记录吗？此操作不可恢复。');
    if (!confirmed) return;

    if (!clearHistoryStore()) {
        showToast('清空失败，请检查浏览器存储权限。', 'error');
        return;
    }

    state.history = [];
    refreshHistoryView();
    showToast('历史记录已清空。', 'success');
}

/* ---- 筛选 ---- */

function setActiveFilterButton(container, target) {
    if (!target.classList.contains('filter-btn')) return;
    container.querySelectorAll('.filter-btn').forEach((btn) => {
        const active = btn === target;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', String(active));
    });
}

/** 某个筛选组合下有没有卡。没有就隐藏对应按钮，并在选中项被藏起来时退回「全部难度」。 */
function pruneLevelFilters() {
    elements.levelFilters.querySelectorAll('.filter-btn').forEach((btn) => {
        const level = btn.dataset.level;
        if (!level) return;
        btn.hidden = filterCards(cards, state.currentCategory, level).length === 0;
    });

    // 原来选中的难度在新类别下没有卡 → 退回全部，否则一点就撞「没有可用卡牌」
    const active = elements.levelFilters.querySelector('.filter-btn.active');
    if (active && active.hidden) {
        state.currentLevel = 'all';
        setActiveFilterButton(elements.levelFilters, elements.levelFilters.querySelector('[data-level="all"]'));
    }
}

function setupEventListeners() {
    elements.drawBtn.addEventListener('click', drawCard);
    elements.saveBtn.addEventListener('click', openSaveModal);
    elements.shareBtn.addEventListener('click', openShareModal);
    elements.confirmSaveBtn.addEventListener('click', saveAnswer);
    elements.cancelSaveBtn.addEventListener('click', closeSaveModal);
    elements.closeShareBtn.addEventListener('click', closeShareModal);
    elements.copyShareBtn.addEventListener('click', copyShareLink);
    elements.clearHistoryBtn.addEventListener('click', clearHistory);
    elements.themeToggleBtn.addEventListener('click', toggleTheme);

    elements.categoryFilters.addEventListener('click', (event) => {
        setActiveFilterButton(elements.categoryFilters, event.target);
        if (event.target.dataset.category) {
            state.currentCategory = event.target.dataset.category;
            pruneLevelFilters();
        }
    });

    elements.levelFilters.addEventListener('click', (event) => {
        setActiveFilterButton(elements.levelFilters, event.target);
        if (event.target.dataset.level) {
            state.currentLevel = event.target.dataset.level;
        }
    });

    elements.saveModal.addEventListener('click', (event) => {
        if (event.target === elements.saveModal) closeSaveModal();
    });

    elements.shareModal.addEventListener('click', (event) => {
        if (event.target === elements.shareModal) closeShareModal();
    });

    elements.answerInput.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') saveAnswer();
    });
}

function init() {
    applyTheme(getStoredTheme());
    pruneLevelFilters();
    refreshCardView();
    refreshHistoryView();
    setupEventListeners();
}

init();

</script>
