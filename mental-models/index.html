<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c27a3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="思维模型卡">
    <link rel="apple-touch-icon" href="../heart-talk/icons/icon-192.png">
    <title>思维模型卡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/theme.css">
    <style>


        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at 12% 14%, rgba(255, 240, 220, 0.9) 0%, rgba(255, 240, 220, 0) 36%),
                radial-gradient(circle at 86% 18%, rgba(244, 216, 183, 0.75) 0%, rgba(244, 216, 183, 0) 34%),
                linear-gradient(160deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            /* 背景画在 body 上，内容比视口矮时下方会露白出现接缝，撑满视口 */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding: 28px 18px calc(40px + env(safe-area-inset-bottom));
            line-height: 1.55;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.26s ease, color 0.2s ease;
        }

        .container { width: 100%; max-width: 760px; position: relative; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            animation: rise-in 0.4s ease-out both;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 10px;
            border-radius: 999px;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--accent-strong); }
        .theme-toggle-btn { min-width: 104px; padding: 9px 14px; }

        header { text-align: center; margin-bottom: 26px; animation: rise-in 0.5s ease-out both; }

        header h1 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: clamp(2rem, 4.3vw, 2.8rem);
            letter-spacing: 0.04em;
            color: #5c3d24;
            margin-bottom: 8px;
        }

        header p { color: var(--text-secondary); font-size: 1.02rem; }

        .filter-section {
            background: var(--paper);
            border: 1px solid rgba(228, 204, 176, 0.78);
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius-lg);
            padding: 14px 18px;
            margin-bottom: 18px;
            animation: rise-in 0.55s ease-out both;
        }
        .filter-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .filter-btn {
            border: 1px solid #d6b58f;
            background: #fff7ee;
            color: #80583a;
            border-radius: 999px;
            padding: 9px 15px;
            font-size: 0.9rem;
            min-height: 40px;
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.18s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(160deg, #d3955a 0%, #be7736 100%);
            color: #fff;
            border-color: #b46a2d;
            box-shadow: 0 7px 14px rgba(167, 101, 44, 0.24);
            transform: translateY(-1px);
        }
        .filter-btn:active { transform: scale(0.98); }

        .progress {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 14px;
            animation: rise-in 0.55s ease-out both;
        }

        .card-container {
            background: var(--paper);
            border: 1px solid rgba(228, 204, 176, 0.78);
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius-xl);
            padding: 34px 28px;
            min-height: 312px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: rise-in 0.6s ease-out both;
        }

        .card-container::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(130deg, rgba(255, 244, 228, 0.75) 0%, rgba(255, 244, 228, 0) 46%),
                repeating-linear-gradient(0deg, rgba(191, 147, 107, 0.035) 0, rgba(191, 147, 107, 0.035) 1px, transparent 1px, transparent 6px);
        }

        .card-category, .card-content, .card-hint, .card-source { position: relative; z-index: 1; }

        .card-source {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.86rem;
            margin-top: 12px;
        }

        .card-container.is-guess { cursor: pointer; }

        .card-category {
            font-size: 0.9rem;
            color: #896a4d;
            margin-bottom: 12px;
            text-align: center;
        }

        .card-content {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: clamp(1.28rem, 2.7vw, 1.68rem);
            line-height: 1.75;
            color: #422c1a;
            text-align: center;
        }

        .card-hint {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.7;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            animation: rise-in 0.65s ease-out both;
        }

        .btn {
            border: none;
            border-radius: 999px;
            min-height: 44px;
            padding: 12px 28px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn {
            background: linear-gradient(160deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #fff;
            box-shadow: 0 8px 18px rgba(166, 98, 38, 0.3);
        }
        .btn-secondary {
            background: #fff3e5;
            color: #875734;
            border: 1px solid #e0bf9b;
            box-shadow: 0 8px 16px rgba(113, 76, 40, 0.12);
        }
        .btn:focus-visible { outline: 2px solid #b96a2b; outline-offset: 2px; }

        .footer-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            animation: rise-in 0.7s ease-out both;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px calc(26px + env(safe-area-inset-bottom)); }
            header { margin-bottom: 18px; }
            header p { font-size: 0.95rem; }
            .card-container { padding: 26px 18px; min-height: 280px; }
            .card-content { font-size: clamp(1.12rem, 4.7vw, 1.35rem); line-height: 1.66; }
            .btn { width: 100%; min-height: 46px; padding-top: 11px; padding-bottom: 11px; }
            .controls { flex-direction: column; align-items: stretch; gap: 8px; }
            .filter-btn { min-height: 44px; padding: 8px 14px; }
        }

        @media (max-width: 360px) {
            body { padding: 14px 10px calc(20px + env(safe-area-inset-bottom)); }
            header h1 { font-size: 1.82rem; letter-spacing: 0.02em; }
            header p { font-size: 0.9rem; }
            .card-container { min-height: 248px; padding: 20px 14px; }
            .card-content { font-size: 1.05rem; line-height: 1.62; }
            .btn { min-height: 46px; font-size: 0.94rem; }
        }

        @media (max-width: 420px) {
            .filter-buttons .filter-btn { flex: 1 1 calc(50% - 8px); text-align: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        :root[data-theme='dark'] .card-content { color: #f7e7d2; }
        :root[data-theme='dark'] .card-category { color: #d4b493; }
        /* ---- 详细解释面板 ---- */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(61, 44, 31, 0.42);
            backdrop-filter: blur(2px);
            z-index: 40;
            animation: fade-in 0.2s ease-out both;
        }
        .sheet {
            position: fixed;
            z-index: 41;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: min(760px, 100%);
            max-height: min(86vh, 86dvh);
            overflow-y: auto;
            overscroll-behavior: contain;
            background: var(--paper);
            border: 1px solid rgba(228, 204, 176, 0.85);
            border-top-left-radius: var(--radius-xl);
            border-top-right-radius: var(--radius-xl);
            box-shadow: 0 -14px 40px rgba(95, 60, 25, 0.26);
            padding: 22px 24px calc(28px + env(safe-area-inset-bottom));
            animation: sheet-up 0.26s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        .sheet-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 6px;
        }
        .sheet h2 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: 1.42rem;
            color: #5c3d24;
            margin: 0 0 4px;
        }
        .sheet-meta { color: var(--text-muted); font-size: 0.88rem; }
        .sheet-close {
            border: 1px solid #e0bf9b;
            background: #fff3e5;
            color: #875734;
            border-radius: 999px;
            min-height: 40px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .sheet-close:hover { background: #f8e6d0; }
        .sheet-close:focus-visible { outline: 2px solid #b96a2b; outline-offset: 2px; }
        .sheet-section { margin-top: 18px; }
        .sheet-label {
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #a17a52;
            margin-bottom: 6px;
        }
        .sheet p { color: var(--text-secondary); font-size: 0.97rem; line-height: 1.78; margin: 0; }
        .sheet ol { margin: 0; padding-left: 1.3em; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.78; }
        .sheet ol li { margin-bottom: 5px; }
        .sheet-example {
            background: var(--paper-strong);
            border: 1px solid rgba(228, 204, 176, 0.7);
            border-radius: var(--radius-md);
            padding: 12px 14px;
        }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes sheet-up {
            from { opacity: 0; transform: translateX(-50%) translateY(24px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        :root[data-theme='dark'] .sheet { background: var(--paper); border-color: rgba(140, 110, 80, 0.6); }
        :root[data-theme='dark'] .sheet h2 { color: #f7e7d2; }
        :root[data-theme='dark'] .sheet-close { background: #3a3027; border-color: #6b563f; color: #e3ccb2; }
        :root[data-theme='dark'] .sheet-close:hover { background: #463a2e; }
        :root[data-theme='dark'] .sheet-example { background: #352c24; border-color: rgba(140, 110, 80, 0.5); }

        @media (max-width: 600px) {
            .sheet { max-height: 90dvh; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); }
            .sheet h2 { font-size: 1.26rem; }
            .sheet-close { min-height: 44px; }
        }
        @media (max-width: 600px) {
            .controls .btn-secondary { width: 100%; }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a class="back-link" href="../">← 返回工具箱</a>
            <button class="btn-secondary btn theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="切换夜间护眼模式">夜间护眼</button>
        </div>
        <header>
            <h1>🧩 思维模型卡</h1>
            <p>抽一个思维模型，套到眼前的事上</p>
        </header>
        <div class="filter-section">
            <div class="filter-buttons" id="categoryFilters">
                <button class="filter-btn active" data-cat="all">全部</button>
                <button class="filter-btn" data-cat="use">用一下</button>
                <button class="filter-btn" data-cat="talk">讲一遍</button>
                <button class="filter-btn" data-cat="guess">猜模型</button>
            </div>
        </div>
        <div class="progress" id="progress"></div>
        <div class="card-container" id="cardContainer">
            <div class="card-category" id="cardCategory"></div>
            <div class="card-content" id="cardContent"></div>
            <div class="card-source" id="cardSource"></div>
            <div class="card-hint" id="cardHint"></div>
        </div>
        <div class="controls">
            <button class="btn" id="nextBtn">换一张卡</button>
            <button class="btn-secondary btn" id="explainBtn" type="button" aria-haspopup="dialog">看详细解释</button>
        </div>
        <div class="footer-note">用法：先有一件真的事 → 再挑一个模型 → 点「看详细解释」补原理。25 个模型，来自 16 本书</div>
    </div>
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
        <div class="sheet-head">
            <div>
                <h2 id="sheetTitle"></h2>
                <div class="sheet-meta" id="sheetMeta"></div>
            </div>
            <button class="sheet-close" id="sheetClose" type="button" aria-label="关闭详细解释">关闭</button>
        </div>
        <div class="sheet-section">
            <div class="sheet-label">原理</div>
            <p id="sheetPrinciple"></p>
        </div>
        <div class="sheet-section">
            <div class="sheet-label">怎么用</div>
            <ol id="sheetHow"></ol>
        </div>
        <div class="sheet-section">
            <div class="sheet-label">例子</div>
            <p class="sheet-example" id="sheetExample"></p>
        </div>
    </div>
    <script>
        const MODELS = [
            { name: "系统 1 / 系统 2", book: "思考，快与慢", author: "卡尼曼",
              use: "这个判断是脱口而出的，还是想过的？先分清楚再往下走。",
              talk: "讲一次「第一反应」后来被证明是错的经历。",
              guess: "我把一个决定拆成「脱口而出的判断」和「想了半天的判断」两半。",
              principle: "大脑有两套处理系统。系统 1 快、自动、靠直觉和联想，几乎不耗力；系统 2 慢、费力、靠推理和计算。问题是系统 2 很懒，多数时候直接采纳系统 1 给出的结论，还替它编理由。",
              how: ["先判断：这个答案是不是「一眼就有」的？是，就标记为系统 1 的产物。",
                    "强制写一条相反的可能，或者写下「我凭什么这么确定」。",
                    "把直觉的结论当成假设去验证，而不是当成事实去执行。"],
              example: "面试前 5 秒的印象几乎全来自系统 1。把它写下来：「我看到了什么、我推断是什么、这条推断可能错在哪」，才可能修正。" },
            { name: "损失厌恶", book: "思考，快与慢", author: "卡尼曼",
              use: "找出这件事里「怕失去什么」，这个恐惧可能被放大过。",
              talk: "讲一次「亏了比赚了更难受」的经历。",
              guess: "同等的得和失摆在面前，我更怕失去那一个。",
              principle: "同等数量的收益和损失，损失带来的心理痛苦大约是收益带来快乐的 2 倍。人对「失去已有的」的敏感度远高于「获得没有的」，于是为了躲损失会做出明显不理性的选择。",
              how: ["先找出你在躲的那个损失，具体写出来。",
                    "把它换成等量的「获得」，再问一次：我还会这么选吗？",
                    "如果答案变了，说明决策被损失厌恶推着走，不是被收益算出来的。"],
              example: "股票亏了死扛不肯卖，赚一点点立刻跑——拿住亏损、卖掉盈利，正好和理性的做法相反。" },
            { name: "锚定效应", book: "思考，快与慢", author: "卡尼曼",
              use: "找出这件事里第一个出现的数字，问：如果没有它，我会估多少？",
              talk: "讲一次被一个报价、一句话带偏的经历。",
              guess: "第一个出现的数字，定住了后面所有判断。",
              principle: "先出现的数字会成为参照点，之后的估计不自觉地朝它靠拢，哪怕这个数字完全无关、甚至明知是随机的。判断被「起点」牵住，调整总是不充分。",
              how: ["找出场景里第一个出现的数字（报价、原价、别人说的数）。",
                    "把它遮住，独立重新估一次。",
                    "两次结果差多少，那个差额就是锚的拉力。"],
              example: "先看标价 1999、再看促销价 999，会觉得便宜；如果先给的是 599，同一件 999 就变贵了。" },
            { name: "多元思维模型", book: "穷查理宝典", author: "芒格",
              use: "换三个学科的角度各看一次：心理、经济、生物，随便挑三个。",
              talk: "讲一次「手里只有锤子，看什么都是钉子」的经历。",
              guess: "我要求自己用心理学、经济学、物理学的常识一起验证一个判断。",
              principle: "每个学科只提供有限的几个基础原理。只用一种视角看世界，就像手里只有锤子——什么问题都当成钉子。把多个学科最基础、最有用的原理凑成一张「格栅」，交叉验证同一个判断，单点偏差会在交叉处暴露出来。",
              how: ["挑 3 个学科（心理、经济、生物、物理、数学……）。",
                    "每个学科各问一句：用这一门的基本原理看，这件事在发生什么？",
                    "看三个结论是否互相印证；分歧最大的地方，就是风险最大的地方。"],
              example: "判断一门生意：心理学看需求从哪来，经济学看竞争格局和利润去了哪，生物学看它在生态里占什么位。" },
            { name: "反过来想", book: "穷查理宝典", author: "芒格",
              use: "不问怎么成功，先问怎么会彻底搞砸，然后避开那条路。",
              talk: "讲一次用「先想失败」避掉的坑。",
              guess: "我只想知道将来会死在哪里，这样我就永远不去那个地方。",
              principle: "通向成功的路径几乎无穷，但通向失败的路径有限且明确。反向思考把问题从「找到最优解」变成「排除确定的坏解」，答案空间小得多，也更容易验证。",
              how: ["写下这个问题：这件事怎样一定会搞砸？至少列 5 条。",
                    "逐条对照现在的做法，勾出已经踩上的。",
                    "先消除踩上的几条，再谈怎么做得更好。"],
              example: "想健康，与其研究长寿秘诀，不如先列出「怎样必然早死」：熬夜、久坐、暴食、不体检，然后避开。" },
            { name: "能力圈", book: "穷查理宝典", author: "芒格",
              use: "先划出「我真的懂」和「我真的不懂」的边界，别跨过去。",
              talk: "讲一次承认「这个我不懂」的经历。",
              guess: "只在懂的范围内下重注，不懂就不碰。",
              principle: "每个人的真实认知边界都比自我感觉窄，但边界本身是可以被识别的。长期胜率来自待在圈内、放弃圈外，而不是把圈画得更大。圈的大小不重要，边界清楚才重要。",
              how: ["给「我真懂」定标准：能讲清原理、能预测结果、见过它怎么失败。",
                    "不满足三条的，一律归到「不懂」，不投入时间也不下注。",
                    "每隔一段时间重查一次边界有没有移动。"],
              example: "不懂药企的审批逻辑和临床数据，就不投药企；错过机会可以接受，亏掉本金不行。" },
            { name: "互惠与承诺一致", book: "影响力", author: "西奥迪尼",
              use: "找出自己「因为先答应过小要求，所以停不下来」的地方。",
              talk: "讲一次被「先小后大」套路过的经历。",
              guess: "答应过的小事，会绑住后面的大事。",
              principle: "两条根深蒂固的社会规则在起作用：一是受人好处要回报（互惠），二是要和自己已经做出的承诺保持一致（承诺一致）。顺序被设计好时，人会一步步走进本来不会同意的请求。",

        (function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('mental-models-theme'); } catch (e) {}
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(saved || (prefersDark ? 'dark' : 'light'));
        })();

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function pool() { return MODELS; }

        function render(m, idx, total) {
            const guessing = cat === "guess";
            $("cardContainer").classList.toggle("is-guess", guessing);
            $("cardCategory").textContent = "「" + CAT_LABEL[cat] + "」";
            if (guessing && !revealed) {
                $("cardContent").textContent = m.guess;
                $("cardSource").textContent = "";
                $("cardHint").textContent = "点卡片看答案";
            } else {
                $("cardContent").textContent = m.name;
                $("cardSource").textContent = "《" + m.book + "》· " + m.author;
                if (cat === "talk") $("cardHint").textContent = "讲一个：" + m.talk;
                else if (cat === "guess") $("cardHint").textContent = "答案如上。讲一个：" + m.talk;
                else $("cardHint").textContent = "问自己：" + m.use;
            }
            $("progress").textContent = `第 ${idx} / ${total} 个模型`;
        }

        let current = null;
        let currentIdx = 1;

        function next() {
            const p = pool();
            if (!queues[cat] || !queues[cat].length) queues[cat] = shuffle(p.slice());
            current = queues[cat].pop();
            currentIdx = p.length - queues[cat].length;
            revealed = cat !== "guess";
            render(current, currentIdx, p.length);
        }

        $("cardContainer").addEventListener("click", () => {
            if (cat !== "guess" || revealed || !current) return;
            revealed = true;
            render(current, currentIdx, pool().length);
        });

        // ---- 详细解释面板 ----
        function openSheet() {
            if (!current) return;
            $("sheetTitle").textContent = current.name;
            $("sheetMeta").textContent = "《" + current.book + "》· " + current.author;
            $("sheetPrinciple").textContent = current.principle;
            $("sheetExample").textContent = current.example;
            const how = $("sheetHow");
            how.textContent = "";
            current.how.forEach((step) => {
                const li = document.createElement("li");
                li.textContent = step;
                how.appendChild(li);
            });
            $("sheetBackdrop").hidden = false;
            $("detailSheet").hidden = false;
            $("detailSheet").scrollTop = 0;
            $("sheetClose").focus();
            document.body.style.overflow = "hidden";
        }

        function closeSheet() {
            $("sheetBackdrop").hidden = true;
            $("detailSheet").hidden = true;
            document.body.style.overflow = "";
            $("explainBtn").focus();
        }

        $("explainBtn").addEventListener("click", openSheet);
        $("sheetClose").addEventListener("click", closeSheet);
        $("sheetBackdrop").addEventListener("click", closeSheet);
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !$("detailSheet").hidden) closeSheet();
        });

        $("nextBtn").addEventListener("click", next);
        $("categoryFilters").addEventListener("click", (e) => {
            const btn = e.target.closest(".filter-btn");
            if (!btn) return;
            cat = btn.dataset.cat;
            document.querySelectorAll("#categoryFilters .filter-btn").forEach((b) => b.classList.toggle("active", b === btn));
            next();
        });
        next();
    </script>
</body>
</html>
